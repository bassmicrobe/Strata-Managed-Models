name: Managed model updates

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build a release even when the current commit was already published
        required: false
        default: false
        type: boolean
  push:
    branches: [managed-models]
    paths:
      - 'apps/host/**'
      - 'managed-local/**'
      - '.github/workflows/managed-updates.yml'

permissions:
  contents: write

concurrency:
  group: managed-models-release
  cancel-in-progress: false

jobs:
  update-and-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: managed-models
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: apps/host/package-lock.json
      - name: Prepare Windows installer compiler
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS could not be installed.' }
          }
      - name: Merge, verify, and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_FORCE: ${{ inputs.force || false }}
        run: node managed-local/sync-and-release.mjs
      - name: Retain installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/strata-managed-*/windows-installer/*setup.exe
            ${{ runner.temp }}/strata-managed-*/installer-test/install.log
            ${{ runner.temp }}/strata-managed-*/installer-test/user-data*/smoke-result.json
            ${{ runner.temp }}/strata-managed-*/installer-test/user-data*/logs/*.log
